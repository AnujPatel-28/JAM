<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="description" content="JAM — listen together in real-time. Create a room, sync music, chat live." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Baseline CSP (docs/security-fixes/002-C2). Tighten connect-src to the
         exact InsForge host in production hosting headers; wildcard kept here
         so preview/staging hosts keep working. No unsafe-inline scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; img-src 'self' https://img.youtube.com https://i.ytimg.com https://images.unsplash.com data:; media-src 'self' https://*.googlevideo.com; connect-src 'self' https://*.insforge.app wss://*.insforge.app https://noembed.com https://www.youtube.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>JAM — Listen Together in Real-Time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
